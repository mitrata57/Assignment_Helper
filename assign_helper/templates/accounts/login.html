{% extends 'base.html' %}

{% block content %}
<!-- Main Container with a subtle academic-style gradient background -->
<div class="flex justify-center items-center min-h-[85vh] bg-slate-50 px-4">
    
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border border-slate-100">
        
        <!-- Header Section -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight mb-2">
                Pick up where you left off
            </h2>
            <p class="text-slate-500 font-medium">
                Don't let the deadline win—enter your details below.
            </p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <!-- Email/Username Field -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1 ml-1">Username</label>
                <input type="text" name="username"  
                       class="w-full px-4 py-3 rounded-xl border border-blue-400 focus:ring-2 focus:blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <div>
                <div class="flex justify-between mb-1 ml-1">
                    <label class="text-sm font-semibold text-slate-700">Password</label>
                    <a href="#" class="text-xs text-blue-600 hover:underline font-medium">Forgot?</a>
                </div>
                <input type="password" name="password"  
                       class="w-full px-4 py-3 rounded-xl border border-blue-400 focus:ring-2 focus:blue-500 focus:border-transparent outline-none transition-all">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-300 /30 transform transition-transform active:scale-95">
                Log In
            </button>
        </form>
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-slate-600 text-sm">
                New to the platform? 
                <a href="/register" class="text-blue-600 font-bold hover:underline ml-1">Create an Account</a>
            </p>
        </div>
        <div class="mt-6 flex items-center justify-center space-x-2 text-xs text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <span>Encrypted & Private Study Session</span>
        </div>
    </div>
</div>
{% endblock %}
