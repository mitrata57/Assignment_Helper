{% extends 'base.html' %}

{% block title %}Register - Go Assignment{% endblock %}

{% block content %}
<main class="max-w-7xl mx-auto px-10 py-12 flex flex-col lg:flex-row items-center gap-12">
    <div class="lg:w-1/2">
        <h1 class="text-4xl font-bold text-slate-800">Start your journey.</h1>
    </div>

    <div class="lg:w-1/2 w-full">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }} <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg mt-4">
                    Register
                </button>
            </form>
        </div>
    </div>
</main>
{% endblock content %}
