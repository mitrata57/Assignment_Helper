<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AssignMate{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#F8FDFF] font-sans flex flex-col min-h-screen">

    <nav class="flex items-center justify-between px-6 md:px-16 py-5 bg-white shadow-sm sticky top-0 z-50">
        
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-md">
                <i class="fas fa-book-reader"></i>
            </div>
            <a href="/" class="font-extrabold text-xl text-slate-800 tracking-tight">
                Assignment <span class="text-blue-600">Helper</span>
            </a>
        </div>

        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <div class="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-full border border-slate-100">
                    <i class="fas fa-user-circle text-blue-600"></i>
                    <span class="text-sm font-semibold text-slate-700">{{ user.username }}</span>
                    
                    <span class="text-[10px] px-2 py-0.5 rounded-full uppercase font-bold
                        {% if user.is_superuser %}
                            bg-indigo-100 text-indigo-700
                        {% else %}
                            bg-blue-100 text-blue-700
                        {% endif %}">
                        {% if user.is_superuser %}
                            Admin
                        {% else %}
                            {{ user.role }}
                        {% endif %}
                    </span>
                </div>

                <form action="{% url 'logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-slate-400 hover:text-red-500 text-sm font-medium ml-2 transition">
                        Logout
                    </button>
                </form>

            {% else %}
                <div class="flex items-center gap-6">
                    <a href="{% url 'login' %}" class="text-slate-600 hover:text-blue-600 font-semibold text-sm">Log in</a>
                    <a href="{% url 'register' %}" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow-md hover:bg-blue-700 transition">
                        Get Started
                    </a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="bg-white border-t border-slate-100 py-6 mt-auto">
        <div class="text-center text-slate-400 text-xs">
            &copy; 2026 Assignment Helper. All rights reserved.
        </div>
    </footer>

</body>
</html>
